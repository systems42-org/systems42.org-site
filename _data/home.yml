# All texts of the home page. Edit here, not in _layouts/home.html.
hero:
  headline: Where AI meets engineering discipline.
  sub: Requirements and architecture in one spec of eighteen sections, kept as a markdown wiki that AI agents read, fill, check and implement. By the makers of req42 and arc42.
  primary: {label: The idea, url: /idea/}
  secondary: {label: Try the dashboard demo, url: "https://dashboard.systems42.org"}
  meta_prefix: "Open source ·"
  meta_highlight: public release planned early 2027

templates:
  headline: Proven templates. AI-powered execution.
  lede: AI agents generate code fast. What they lack is a lasting record of what the system must do and how it is built. The spec is that record.
  paragraphs:
    - The spec is a set of plain markdown files, structured by the req42 and arc42 templates and versioned in git. Agents read it before they generate and test code, so code can be traced back to a requirement or an architecture decision.
    - People set the goals, the constraints and the decisions that matter. Agents do the writing, the checking and the implementation. The templates give both the same structure to work in.
    - systems42 comes from Peter Hruschka, Peter Gerstbach and Gernot Starke, the people behind req42 and arc42.
  quote_em: Strategic decisions stay human. Tactical execution goes agentic.
  quote_rest: The templates keep both in step.
  quote_who: The systems42 idea in short

loops:
  headline: Three loops keep the spec alive.
  lede: AI fills and checks the spec. Humans decide where it matters.
  # Step names and order as in the loop diagrams (_includes/loops/) and on /idea/.
  items:
    - name: Capture
      figure: capture
      driver: AI, started by a human
      driver_class: h-ai
      steps:
        - {name: Markdownify, text: "Raw input becomes clean, uniform markdown."}
        - {name: Cross-check and link, text: The matching spec sections are filled and cross-linked.}
        - {name: Ask questions, text: "Where the input does not fit, the AI asks a human."}
    - name: Inspect
      figure: inspect
      driver: AI, scheduled or on demand
      driver_class: h-ai
      steps:
        - {name: Detect issues, text: "The spec is checked against rules, guardrails and constraints."}
        - {name: Flag gaps, text: "Missing, inconsistent or outdated parts are marked."}
        - {name: Update backlog, text: Every finding goes onto the list of open issues.}
    - name: Clarify
      figure: clarify
      driver: Humans and AI together
      driver_class: h-both
      steps:
        - {name: Pick topic, text: Humans pick an open issue.}
        - {name: Discuss, text: They discuss it with the AI until there is a decision.}
        - {name: Write back, text: The AI writes the outcome into the spec or the rules.}

spec:
  headline: One spec. Eighteen sections.
  lede: Six sections from req42 for requirements, six from arc42 for architecture, and six common to both. Together they are the single source of truth from which code is generated and tested.
  text: Both templates have been used for more than 20 years, in many countries and domains. systems42 does not replace them. It makes them executable.

status:
  headline: Stay tuned.
  highlight: Public release early 2027.
  text: We are testing the approach with many examples. As soon as we have solid results we will publish systems42 so that you can start directly with your own projects.
  demo: {label: Try the dashboard demo, url: "https://dashboard.systems42.org"}
  event: seminar-2027-01

family:
  headline: Part of the 42 family.
  lede: For more than 20 years we have created pragmatic open-source tools to support your development efforts.

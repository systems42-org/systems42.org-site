# All texts of the home page. Edit here, not in _layouts/home.html.
hero:
  headline: Where AI meets engineering discipline.
  sub: Built on the pragmatic, field-proven discipline of req42 and arc42, extended to AI-native systems. Proven templates, AI-powered execution.
  primary: {label: The idea, url: /idea/}
  secondary: {label: Training, url: /training/}
  meta_prefix: "Open source · built on req42 and arc42 ·"
  meta_highlight: public release planned early 2027

templates:
  headline: Proven templates. AI-powered execution.
  lede: Requirements and architecture specs are not afterthoughts. They are living contracts that agents reference during generation and testing.
  paragraphs:
    - "Our templates de-risk the agentic cycle, and AI-powered execution makes that cycle run at machine speed. Management gains traceability: every line of code can be mapped back to documented requirements and architectural decisions."
    - Where human judgment defines the guardrails, agentic execution fills the lanes. The templates keep both in sync.
  quote_em: Strategic decisions stay human. Tactical execution goes agentic.
  quote_rest: The templates are the handshake that makes both possible.
  quote_who: The systems42 idea in one sentence

loops:
  headline: Three loops keep the spec alive.
  lede: AI fills and checks the spec. Humans decide where it matters.
  items:
    - name: Ingest
      figure: ingest
      text: Humans provide raw input. AI turns it into clean markdown, files it into the matching spec sections, cross-links it and asks when something does not fit.
      driver: AI, started by a human
      driver_class: h-ai
    - name: Audit
      figure: audit
      text: Time-triggered or on demand, AI checks the spec against rules, guardrails and constraints and adds every finding to the backlog.
      driver: AI, scheduled or on demand
      driver_class: h-ai
    - name: Clarify
      figure: clarify
      text: Humans pick an open point, discuss it with the AI, and have the outcome written back into the spec or the rules.
      driver: Humans and AI together
      driver_class: h-both

spec:
  headline: One spec. Eighteen drawers.
  lede: req42 for requirements, arc42 for architecture, six sections they share. Together they are the single source of truth from which code is generated and tested.
  text: Both templates have been used for more than 20 years, in many countries and domains. systems42 does not replace them. It makes them executable.

status:
  headline: Stay tuned.
  highlight: Public release early 2027.
  text: We are testing the approach with many examples. As soon as we have solid results we will publish systems42 so that you can start directly with your own projects.
  event: seminar-2027-01

family:
  headline: Part of the 42 family.
  lede: For more than 20 years we have created pragmatic open-source tools to support your development efforts.

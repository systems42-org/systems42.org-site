# Seminars and events shown on /training/ and referenced from the home page.
#
# Registration runs through the arc42 training form and service
# (trainings.arc42.org). arc42_id must equal the date id in
# arc42/trainings.arc42.org-site/_data/trainings.yml: the form preselects the
# course from ?kurs=<arc42_id>, and the service accepts only booking codes it
# finds in that site's feed. The title stays English on every page.
# where_de is the German line for the printed flyer (_flyers/de.md).
# lang is the language the seminar is held in; its card on /training/
# offers the flyer (_flyers/) in that language.
# trainers shows on /training/ only; the flyer lists dates without them.
#
# This mirrors the date in arc42's trainings.yml by hand, on purpose: no build
# dependency on arc42. Only arc42_id links the two, so keep it in step.
# arc42's admin app derives it as <course>-<mon>-<year>, plus -en for dates
# held in English; the course is maispec (booking codes "YY-MM MAISPEC").
#
# registration_open shows the Register button. Set it to true only once the
# date is live on trainings.arc42.org; before that the form would neither
# preselect the course nor accept the booking.
- id: seminar-2027-01
  arc42_id: maispec-jan-2027
  registration_open: true
  title: Mastering AI-Driven Specification
  trainers: [Peter Hruschka, Peter Gerstbach]
  subtitle: One spec for requirements and architecture – ready for AI agents to build on
  day_range: 28–29
  month: January 2027
  where: Vienna, held in German
  lang: de
  where_de: Wien, auf Deutsch
  date_iso: 2027-01-28
  short: First seminar, Jan 28–29, 2027 in Vienna
  agenda_url: /training/#agenda
- id: seminar-2027-02-online
  arc42_id: maispec-feb-2027-en
  registration_open: true
  title: Mastering AI-Driven Specification
  trainers: [Peter Hruschka, Peter Gerstbach]
  subtitle: One spec for requirements and architecture – ready for AI agents to build on
  day_range: 2–3
  month: February 2027
  where: Online, held in English (time zone CET, Vienna)
  lang: en
  where_de: Online, auf Englisch (MEZ)
  date_iso: 2027-02-02
  short: Online seminar, Feb 2–3, 2027
  agenda_url: /training/#agenda

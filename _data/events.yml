# Seminars and events shown on /training/ and referenced from the home page.
#
# Registration runs through the arc42 training form and service
# (trainings.arc42.org). arc42_id must equal the date id in
# arc42/trainings.arc42.org-site/_data/trainings.yml: the form preselects the
# course from ?kurs=<arc42_id>, and the service accepts only booking codes it
# finds in that site's feed. The title stays English on every page.
# where_de is the German line for the printed flyer (_flyers/de.md).
#
# registration_open shows the Register button. Set it to true only once the
# date is live on trainings.arc42.org; before that the form would neither
# preselect the course nor accept the booking.

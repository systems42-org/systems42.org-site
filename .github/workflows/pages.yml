# Build the Jekyll site and deploy it to GitHub Pages.
# Repository settings > Pages > Build and deployment > Source must be "GitHub Actions".
# Pull requests run the build only (site + flyer PDFs) and never deploy.
# The weekly run rebuilds main so that past dates drop out of the flyers.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys queue one after another; a PR build only replaces its own older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      # Print the flyers (_flyers/) to PDF into _site. Fails the build, and so
      # the deploy, if a flyer no longer fits on one A4 page.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Print flyers to PDF
        run: npm run flyer
        env:
          BASEURL: ${{ steps.pages.outputs.base_path }}
      # On a pull request, keep the PDFs as a run artifact to look at before merging.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: flyer-pdfs
          path: _site/assets/flyer-*.pdf
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

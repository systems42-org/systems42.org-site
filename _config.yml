title: systems42
tagline: Where AI meets engineering discipline
description: >-
  systems42: agentic engineering built on the proven templates req42 and arc42.
  Requirements and architecture as living contracts that AI agents read, fill, check and implement.
url: "https://systems42.org"
baseurl: ""
lang: en
# og:locale (jekyll-seo-tag); German pages set their own `locale: de_AT`.
locale: en_US
author:
  name: systems42
logo: /assets/img/logo-512.png

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
sass:
  style: compressed
  sass_dir: _sass
  quiet_deps: true

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

permalink: pretty

# Flyer PDFs are written into _site after the build (scripts/flyer-pdf.mjs).
# Keep them across rebuilds, so they survive while the dev server is running.
keep_files: [".git", ".svn", "assets/flyer-"]

# All content pages live in _pages/ (a collection that outputs pages).
# Each page sets its own permalink in the front matter.
collections:
  pages:
    output: true
    permalink: /:name/
  # Printable flyers: an A4 HTML page each, printed to PDF after the build
  # by scripts/flyer-pdf.mjs. Not listed in search or the sitemap.
  flyers:
    output: true
    permalink: /training/flyer-:name/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
      # Link preview image (og:image, twitter:image), 1200x630, rendered by
      # scripts/og-image.mjs (npm run og-image) from scripts/og-image.html.
      image: /assets/img/og-image.png
  - scope:
      path: ""
      type: flyers
    values:
      layout: flyer
      search: false
      sitemap: false

exclude:
  - Makefile
  - docker/
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor/
  - node_modules/
  - package.json
  - package-lock.json
  - scripts/
  - .claude/
  - .impeccable/

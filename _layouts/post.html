---
layout: default
---
<div class="wrap pagehead prose">
  <p class="post-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>{% if page.author %} · {{ page.author }}{% endif %}</p>
  <h1>{{ page.title }}</h1>
  {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
</div>
<div class="wrap docs docs-single">
  <article class="article">
    {{ content }}
    <p class="post-back"><a href="{{ '/blog/' | relative_url }}">All posts</a></p>
  </article>
</div>

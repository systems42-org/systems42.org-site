<header class="masthead">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/logo.svg' | relative_url }}" alt="" width="38" height="38">
      systems<span class="num">42</span>
    </a>
    <nav class="nav" aria-label="Main">
      {% for item in site.data.nav.primary %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url or page.nav == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
    <div class="mast-right">
      <button class="icon-btn search-open" type="button" data-search-open aria-label="Search" title="Search">
        {% include icons.html name="search" %}<kbd class="kbd-hint" aria-hidden="true">⌘K</kbd>
      </button>
      <button class="btn-42" type="button" data-pop="family-pop" aria-expanded="false" aria-haspopup="true" aria-controls="family-pop" title="The 42 family">42</button>
      {% include family-menu.html %}
      <button class="icon-btn more-open" type="button" data-pop="more-pop" aria-expanded="false" aria-haspopup="true" aria-controls="more-pop" aria-label="More" title="More">
        {% include icons.html name="menu" %}
      </button>
      {% include more-menu.html %}
    </div>
  </div>
</header>
<div class="peaks-rule" aria-hidden="true"></div>

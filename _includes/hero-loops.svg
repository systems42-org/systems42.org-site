{% comment %}
  Hero figure of the home page: the three loops, each leaving and re-entering the one spec.
  The ring is drawn in the top position and repeated, rotated by 120 and 240 degrees.
  Loop names and drivers repeat _data/home.yml (loops.items); keep them in step.
  The spec tile repeats the section grid: 6 req42, 6 arc42, 6 common.
  Styles: _sass/_home.scss (.hero-loops).
{% endcomment %}
<svg class="hero-loops" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488 460" role="img" aria-labelledby="t-hero-loops">
  <title id="t-hero-loops">Three loops run through one spec of eighteen sections: Capture (AI, started by a human), Inspect (AI, scheduled or on demand) and Clarify (humans and AI together).</title>
  <defs>
    <marker id="hl-arrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16"><path class="head" d="M3 2 L12 8 L3 14"/></marker>
  </defs>

  <g class="l1"><path class="ring" d="M176.9 239.5 A120 120 0 1 1 311.1 239.5"/><g class="orbit"><circle class="dot" cx="244" cy="20" r="5.5"/></g></g>
  <g class="l2" transform="rotate(120 244 260)"><path class="ring" d="M176.9 239.5 A120 120 0 1 1 311.1 239.5"/><g class="orbit"><circle class="dot" cx="244" cy="20" r="5.5"/></g></g>
  <g class="l3" transform="rotate(240 244 260)"><path class="ring" d="M176.9 239.5 A120 120 0 1 1 311.1 239.5"/><g class="orbit"><circle class="dot" cx="244" cy="20" r="5.5"/></g></g>

  <rect class="tile" x="190" y="220" width="108" height="80" rx="9"/>
  <text class="tile-label" x="244" y="239">One spec</text>
  <g class="cells">
    <g class="req"><rect x="199" y="246" width="12" height="12" rx="2.5"/><rect x="214.6" y="246" width="12" height="12" rx="2.5"/><rect x="230.2" y="246" width="12" height="12" rx="2.5"/><rect x="199" y="261.6" width="12" height="12" rx="2.5"/><rect x="214.6" y="261.6" width="12" height="12" rx="2.5"/><rect x="230.2" y="261.6" width="12" height="12" rx="2.5"/></g>
    <g class="arc"><rect x="245.8" y="246" width="12" height="12" rx="2.5"/><rect x="261.4" y="246" width="12" height="12" rx="2.5"/><rect x="277" y="246" width="12" height="12" rx="2.5"/><rect x="245.8" y="261.6" width="12" height="12" rx="2.5"/><rect x="261.4" y="261.6" width="12" height="12" rx="2.5"/><rect x="277" y="261.6" width="12" height="12" rx="2.5"/></g>
    <g class="fuse"><rect x="199" y="277.2" width="12" height="12" rx="2.5"/><rect x="214.6" y="277.2" width="12" height="12" rx="2.5"/><rect x="230.2" y="277.2" width="12" height="12" rx="2.5"/><rect x="245.8" y="277.2" width="12" height="12" rx="2.5"/><rect x="261.4" y="277.2" width="12" height="12" rx="2.5"/><rect x="277" y="277.2" width="12" height="12" rx="2.5"/></g>
  </g>

  <text class="name" x="244" y="92">Capture</text>
  <text class="driver" y="116"><tspan x="244">AI, started</tspan><tspan x="244" dy="19">by a human</tspan></text>
  <text class="name" x="372" y="300">Inspect</text>
  <text class="driver" y="324"><tspan x="372">AI, scheduled</tspan><tspan x="372" dy="19">or on demand</tspan></text>
  <text class="name" x="116" y="300">Clarify</text>
  <text class="driver" y="324"><tspan x="116">Humans and AI</tspan><tspan x="116" dy="19">together</tspan></text>
</svg>
